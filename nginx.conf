server {
    listen 80;
    server_name marketing.glenngo.com;
    root /usr/share/nginx/html/glenngo;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name marketing.replaipilot.com;
